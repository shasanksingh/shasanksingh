<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Repository constellation</title>
  <desc id="desc">A visual map of Shashank Singh's repositories grouped around AI copilots, memory systems, RAG, and product interfaces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <style>
      .title { fill:#f8fafc; font:800 30px Inter, Segoe UI, Arial, sans-serif; }
      .sub { fill:#cbd5e1; font:500 14px Inter, Segoe UI, Arial, sans-serif; }
      .node { fill:#f8fafc; font:800 16px Inter, Segoe UI, Arial, sans-serif; }
      .small { fill:#cbd5e1; font:600 12px Inter, Segoe UI, Arial, sans-serif; }
      .edge { stroke:#67e8f9; stroke-width:2; opacity:.34; }
    </style>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="56" y="58" class="title">Repository Constellation</text>
  <text x="58" y="86" class="sub">A portfolio orbiting around AI assistants, knowledge systems, retrieval, and product interfaces.</text>

  <line x1="600" y1="250" x2="236" y2="158" class="edge"/>
  <line x1="600" y1="250" x2="222" y2="340" class="edge"/>
  <line x1="600" y1="250" x2="430" y2="408" class="edge"/>
  <line x1="600" y1="250" x2="804" y2="406" class="edge"/>
  <line x1="600" y1="250" x2="960" y2="334" class="edge"/>
  <line x1="600" y1="250" x2="958" y2="154" class="edge"/>
  <line x1="600" y1="250" x2="404" y2="140" class="edge"/>

  <g filter="url(#shadow)">
    <circle cx="600" cy="250" r="76" fill="url(#cyan)"/>
    <text x="548" y="246" class="node">AI Builder</text>
    <text x="552" y="272" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">agents + RAG + UX</text>

    <g transform="translate(100 112)">
      <rect width="272" height="92" rx="16" fill="rgba(15,23,42,.9)" stroke="rgba(103,232,249,.28)"/>
      <rect x="18" y="20" width="52" height="52" rx="12" fill="url(#cyan)"/>
      <text x="88" y="38" class="node">SQL Copilot</text>
      <text x="88" y="64" class="small">schema-aware text-to-SQL</text>
    </g>
    <g transform="translate(90 294)">
      <rect width="264" height="92" rx="16" fill="rgba(15,23,42,.9)" stroke="rgba(110,231,183,.28)"/>
      <rect x="18" y="20" width="52" height="52" rx="12" fill="url(#green)"/>
      <text x="88" y="38" class="node">MemoraeAI</text>
      <text x="88" y="64" class="small">personal intelligence OS</text>
    </g>
    <g transform="translate(320 392)">
      <rect width="250" height="82" rx="16" fill="rgba(15,23,42,.9)" stroke="rgba(196,181,253,.28)"/>
      <rect x="18" y="16" width="50" height="50" rx="12" fill="url(#violet)"/>
      <text x="86" y="34" class="node">Knowledge-System</text>
      <text x="86" y="60" class="small">graph QA for teams</text>
    </g>
    <g transform="translate(676 392)">
      <rect width="270" height="82" rx="16" fill="rgba(15,23,42,.9)" stroke="rgba(253,230,138,.30)"/>
      <rect x="18" y="16" width="50" height="50" rx="12" fill="url(#amber)"/>
      <text x="86" y="34" class="node">ATS Resume AI</text>
      <text x="86" y="60" class="small">document intelligence</text>
    </g>
    <g transform="translate(860 288)">
      <rect width="272" height="92" rx="16" fill="rgba(15,23,42,.9)" stroke="rgba(103,232,249,.28)"/>
      <rect x="18" y="20" width="52" height="52" rx="12" fill="url(#cyan)"/>
      <text x="88" y="38" class="node">semantic-rag</text>
      <text x="88" y="64" class="small">retrieval assessment</text>
    </g>
    <g transform="translate(842 108)">
      <rect width="276" height="92" rx="16" fill="rgba(15,23,42,.9)" stroke="rgba(110,231,183,.28)"/>
      <rect x="18" y="20" width="52" height="52" rx="12" fill="url(#green)"/>
      <text x="88" y="38" class="node">Portfolio + UI</text>
      <text x="88" y="64" class="small">product experiences</text>
    </g>
  </g>
</svg>
