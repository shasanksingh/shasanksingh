<svg width="1100" height="360" viewBox="0 0 1100 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">3D AI engineering stack</title>
  <desc id="desc">Layered 3D stack showing frontend, APIs, agent graph, retrieval, data, and deployment tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="layer1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#BBF7D0"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#DDD6FE"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="layer4" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect width="1100" height="360" rx="30" fill="url(#bg)"/>
  <text x="64" y="62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#F8FAFC">Stack Layers</text>
  <text x="64" y="89" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#94A3B8">How the AI products are usually assembled from interface to deployment.</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(92 126)">
      <path d="M0 44L166 0L332 44L166 88L0 44Z" fill="url(#layer1)"/>
      <path d="M0 44V72L166 116V88L0 44Z" fill="#0B3B60"/>
      <path d="M332 44V72L166 116V88L332 44Z" fill="#0E2458"/>
      <text x="166" y="48" text-anchor="middle" font-size="18" font-weight="900" fill="#F8FAFC">FRONTEND</text>
      <text x="166" y="72" text-anchor="middle" font-size="12" fill="#DBEAFE">Next.js | React | Tailwind | dashboards</text>
    </g>

    <g transform="translate(292 176)">
      <path d="M0 44L166 0L332 44L166 88L0 44Z" fill="url(#layer2)"/>
      <path d="M0 44V72L166 116V88L0 44Z" fill="#14532D"/>
      <path d="M332 44V72L166 116V88L332 44Z" fill="#166534"/>
      <text x="166" y="48" text-anchor="middle" font-size="18" font-weight="900" fill="#052E16">API + SERVICES</text>
      <text x="166" y="72" text-anchor="middle" font-size="12" fill="#052E16">FastAPI | Flask | Node.js | auth</text>
    </g>

    <g transform="translate(492 126)">
      <path d="M0 44L166 0L332 44L166 88L0 44Z" fill="url(#layer3)"/>
      <path d="M0 44V72L166 116V88L0 44Z" fill="#312E81"/>
      <path d="M332 44V72L166 116V88L332 44Z" fill="#4C1D95"/>
      <text x="166" y="48" text-anchor="middle" font-size="18" font-weight="900" fill="#F8FAFC">AGENT GRAPH</text>
      <text x="166" y="72" text-anchor="middle" font-size="12" fill="#F5F3FF">LangGraph | tools | validation gates</text>
    </g>

    <g transform="translate(692 176)">
      <path d="M0 44L166 0L332 44L166 88L0 44Z" fill="url(#layer4)"/>
      <path d="M0 44V72L166 116V88L0 44Z" fill="#78350F"/>
      <path d="M332 44V72L166 116V88L332 44Z" fill="#92400E"/>
      <text x="166" y="48" text-anchor="middle" font-size="18" font-weight="900" fill="#451A03">RETRIEVAL + DATA</text>
      <text x="166" y="72" text-anchor="middle" font-size="12" fill="#451A03">Postgres | SQLite | ChromaDB | vectors</text>
    </g>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="246" y="302" width="608" height="36" rx="13" fill="#020617" stroke="#38BDF8" stroke-opacity="0.3"/>
    <text x="550" y="325" text-anchor="middle" font-size="14" font-weight="700" fill="#CBD5E1">GitHub | Vercel | environment config | production-focused delivery</text>
  </g>
</svg>
