<svg width="960" height="360" viewBox="0 0 960 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="40" y1="24" x2="920" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1224"/>
      <stop offset="0.52" stop-color="#111C38"/>
      <stop offset="1" stop-color="#071827"/>
    </linearGradient>
    <linearGradient id="core-top" x1="584" y1="96" x2="786" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="core-left" x1="586" y1="154" x2="684" y2="276" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="core-right" x1="684" y1="154" x2="784" y2="276" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#38BDF8" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#020617" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="958" height="358" rx="8" fill="url(#background)" stroke="#1E3A5F" stroke-width="2"/>
  <rect x="1" y="1" width="958" height="358" rx="8" fill="url(#grid)"/>

  <g font-family="Inter, Segoe UI, sans-serif">
    <text x="54" y="65" fill="#22D3EE" font-size="14" font-weight="700" letter-spacing="2">PRODUCTION AI ENGINEERING</text>
    <text x="54" y="112" fill="#F8FAFC" font-size="31" font-weight="750">Grounded systems, built to ship.</text>
    <text x="54" y="148" fill="#94A3B8" font-size="16">Retrieval, agents, typed APIs, evaluation, and product UX.</text>

    <g transform="translate(54 196)">
      <rect width="110" height="38" rx="6" fill="#0F2B48" stroke="#0EA5E9" stroke-opacity="0.7"/>
      <circle cx="20" cy="19" r="5" fill="#22D3EE">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="35" y="24" fill="#E0F2FE" font-size="13" font-weight="700">RAG</text>
    </g>
    <g transform="translate(178 196)">
      <rect width="118" height="38" rx="6" fill="#24164A" stroke="#8B5CF6" stroke-opacity="0.8"/>
      <circle cx="20" cy="19" r="5" fill="#A78BFA">
        <animate attributeName="opacity" values="1;0.45;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="35" y="24" fill="#EDE9FE" font-size="13" font-weight="700">AGENTS</text>
    </g>
    <g transform="translate(310 196)">
      <rect width="128" height="38" rx="6" fill="#0B332F" stroke="#14B8A6" stroke-opacity="0.8"/>
      <circle cx="20" cy="19" r="5" fill="#2DD4BF">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="35" y="24" fill="#CCFBF1" font-size="13" font-weight="700">FASTAPI</text>
    </g>

    <path d="M54 276H426" stroke="#334155" stroke-width="2"/>
    <circle cx="54" cy="276" r="4" fill="#22D3EE" filter="url(#glow)">
      <animate attributeName="cx" values="54;426;54" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="54" y="309" fill="#64748B" font-size="13">QUERY  /  RETRIEVE  /  REASON  /  VALIDATE  /  RESPOND</text>
  </g>

  <g filter="url(#soft-shadow)">
    <ellipse cx="686" cy="283" rx="150" ry="31" fill="#020617" fill-opacity="0.55"/>
    <ellipse cx="686" cy="178" rx="186" ry="77" stroke="#22D3EE" stroke-opacity="0.28" stroke-width="2" transform="rotate(-12 686 178)"/>
    <ellipse cx="686" cy="178" rx="150" ry="58" stroke="#8B5CF6" stroke-opacity="0.38" stroke-width="2" transform="rotate(25 686 178)"/>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 2;0 -10;0 2" dur="4.5s" repeatCount="indefinite"/>
      <path d="M686 82L790 140L686 198L582 140L686 82Z" fill="url(#core-top)" stroke="#BAE6FD" stroke-opacity="0.65"/>
      <path d="M582 140L686 198V280L582 222V140Z" fill="url(#core-left)" stroke="#38BDF8" stroke-opacity="0.5"/>
      <path d="M790 140L686 198V280L790 222V140Z" fill="url(#core-right)" stroke="#A78BFA" stroke-opacity="0.55"/>
      <path d="M686 111L739 140L686 169L633 140L686 111Z" fill="#E0F2FE" fill-opacity="0.2" stroke="#E0F2FE" stroke-opacity="0.65"/>
      <circle cx="686" cy="140" r="18" fill="#E0F2FE" fill-opacity="0.9" filter="url(#glow)">
        <animate attributeName="r" values="14;20;14" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="fill-opacity" values="0.65;1;0.65" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <path d="M616 180L686 219L756 180" stroke="#E0F2FE" stroke-opacity="0.3"/>
      <path d="M616 207L686 246L756 207" stroke="#E0F2FE" stroke-opacity="0.18"/>
    </g>

    <circle r="7" fill="#22D3EE" filter="url(#glow)">
      <animateMotion path="M500 180C555 76 790 69 868 177C786 285 558 282 500 180Z" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#A78BFA" filter="url(#glow)">
      <animateMotion path="M548 93C697 49 844 132 819 234C670 278 535 203 548 93Z" dur="7s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#34D399" filter="url(#glow)">
      <animateMotion path="M520 240C609 311 820 276 855 151C771 69 576 91 520 240Z" dur="11s" begin="-4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
