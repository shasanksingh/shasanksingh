<svg width="960" height="300" viewBox="0 0 960 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="agent-background" x1="22" y1="18" x2="936" y2="282" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090F20"/>
      <stop offset="0.5" stop-color="#12152F"/>
      <stop offset="1" stop-color="#071B28"/>
    </linearGradient>
    <linearGradient id="planner-top" x1="480" y1="76" x2="480" y2="168" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="agent-flow" x1="170" y1="150" x2="790" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="agent-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="agent-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#60A5FA" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="958" height="298" rx="8" fill="url(#agent-background)" stroke="#273557" stroke-width="2"/>
  <rect x="1" y="1" width="958" height="298" rx="8" fill="url(#agent-grid)"/>

  <g font-family="Inter, Segoe UI, sans-serif">
    <text x="42" y="46" fill="#E2E8F0" font-size="20" font-weight="750">Agent workflow with visible control</text>
    <text x="42" y="70" fill="#64748B" font-size="13">Plan, retrieve, use tools, validate, and return control to the user.</text>
  </g>

  <ellipse cx="480" cy="166" rx="278" ry="88" stroke="url(#agent-flow)" stroke-opacity="0.42" stroke-width="2" stroke-dasharray="9 12">
    <animate attributeName="stroke-dashoffset" values="0;-84" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="480" cy="166" rx="206" ry="64" stroke="#38BDF8" stroke-opacity="0.16" transform="rotate(-12 480 166)"/>

  <g font-family="Inter, Segoe UI, sans-serif" text-anchor="middle">
    <g transform="translate(480 135)">
      <animateTransform attributeName="transform" type="translate" values="480 138;480 128;480 138" dur="4s" repeatCount="indefinite"/>
      <path d="M0 -53L72 -17L0 19L-72 -17L0 -53Z" fill="url(#planner-top)" stroke="#DDD6FE"/>
      <path d="M-72 -17L0 19V77L-72 41V-17Z" fill="#3730A3" stroke="#818CF8" stroke-opacity="0.55"/>
      <path d="M72 -17L0 19V77L72 41V-17Z" fill="#312E81" stroke="#A78BFA" stroke-opacity="0.55"/>
      <circle cx="0" cy="-16" r="14" fill="#F5F3FF" fill-opacity="0.92" filter="url(#agent-glow)">
        <animate attributeName="r" values="11;16;11" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="8" fill="#FFFFFF" font-size="12" font-weight="800">PLANNER</text>
      <text x="0" y="103" fill="#C4B5FD" font-size="11" font-weight="700">STATE + POLICY</text>
    </g>

    <g transform="translate(210 129)">
      <path d="M0 -24L38 -5L0 14L-38 -5L0 -24Z" fill="#0891B2" stroke="#67E8F9"/>
      <path d="M-38 -5L0 14V43L-38 24V-5Z" fill="#155E75"/>
      <path d="M38 -5L0 14V43L38 24V-5Z" fill="#164E63"/>
      <text x="0" y="8" fill="#ECFEFF" font-size="11" font-weight="800">TOOLS</text>
    </g>

    <g transform="translate(304 230)">
      <path d="M0 -24L38 -5L0 14L-38 -5L0 -24Z" fill="#0D9488" stroke="#99F6E4"/>
      <path d="M-38 -5L0 14V43L-38 24V-5Z" fill="#115E59"/>
      <path d="M38 -5L0 14V43L38 24V-5Z" fill="#134E4A"/>
      <text x="0" y="8" fill="#F0FDFA" font-size="10" font-weight="800">RETRIEVE</text>
    </g>

    <g transform="translate(656 230)">
      <path d="M0 -24L38 -5L0 14L-38 -5L0 -24Z" fill="#2563EB" stroke="#BFDBFE"/>
      <path d="M-38 -5L0 14V43L-38 24V-5Z" fill="#1D4ED8"/>
      <path d="M38 -5L0 14V43L38 24V-5Z" fill="#1E3A8A"/>
      <text x="0" y="8" fill="#EFF6FF" font-size="10" font-weight="800">MEMORY</text>
    </g>

    <g transform="translate(750 129)">
      <path d="M0 -24L38 -5L0 14L-38 -5L0 -24Z" fill="#DB2777" stroke="#FBCFE8"/>
      <path d="M-38 -5L0 14V43L-38 24V-5Z" fill="#BE185D"/>
      <path d="M38 -5L0 14V43L38 24V-5Z" fill="#831843"/>
      <text x="0" y="8" fill="#FDF2F8" font-size="10" font-weight="800">GUARD</text>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, sans-serif">
    <rect x="55" y="135" width="92" height="42" rx="6" fill="#0C263F" stroke="#38BDF8" stroke-opacity="0.65"/>
    <text x="101" y="161" fill="#BAE6FD" font-size="12" font-weight="700" text-anchor="middle">USER GOAL</text>
    <path d="M148 156H183" stroke="#38BDF8" stroke-width="2" stroke-dasharray="5 6"/>

    <rect x="813" y="135" width="92" height="42" rx="6" fill="#113226" stroke="#34D399" stroke-opacity="0.65"/>
    <text x="859" y="161" fill="#BBF7D0" font-size="12" font-weight="700" text-anchor="middle">ANSWER</text>
    <path d="M777 156H812" stroke="#34D399" stroke-width="2" stroke-dasharray="5 6"/>
  </g>

  <circle r="6" fill="#22D3EE" filter="url(#agent-glow)">
    <animateMotion path="M202 166C223 55 718 45 758 153C724 271 243 279 202 166Z" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#A78BFA" filter="url(#agent-glow)">
    <animateMotion path="M758 166C730 275 236 278 202 160C241 54 718 48 758 166Z" dur="8s" begin="-3s" repeatCount="indefinite"/>
  </circle>
</svg>
