<svg width="1100" height="410" viewBox="0 0 1100 410" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">3D AI orchestration workflow</title>
  <desc id="desc">An AI workflow showing context, retrieval, planner graph, tools, validation, and product UI.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="topBlue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="topPurple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#DDD6FE"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="topGreen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#BBF7D0"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="topAmber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#020617" flood-opacity="0.7"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1100" height="410" rx="30" fill="url(#panel)"/>
  <path d="M39 322C234 237 368 361 560 252C738 151 899 191 1059 79" stroke="#38BDF8" stroke-opacity="0.16" stroke-width="2"/>
  <path d="M70 93H1030" stroke="#64748B" stroke-opacity="0.16"/>
  <path d="M70 315H1030" stroke="#64748B" stroke-opacity="0.16"/>

  <text x="62" y="58" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#F8FAFC">AI Orchestration Pattern</text>
  <text x="62" y="84" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#94A3B8">A product-grade loop for answers, SQL, reports, and actions.</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(70 148)">
      <path d="M0 42L80 0L160 42L80 84L0 42Z" fill="url(#topBlue)"/>
      <path d="M0 42V86L80 128V84L0 42Z" fill="#0B3B60"/>
      <path d="M160 42V86L80 128V84L160 42Z" fill="#0E2458"/>
      <text x="80" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#F8FAFC">INTENT</text>
      <text x="80" y="70" text-anchor="middle" font-size="11" fill="#DBEAFE">prompt + task</text>
    </g>
    <g transform="translate(245 148)">
      <path d="M0 42L80 0L160 42L80 84L0 42Z" fill="url(#topGreen)"/>
      <path d="M0 42V86L80 128V84L0 42Z" fill="#14532D"/>
      <path d="M160 42V86L80 128V84L160 42Z" fill="#166534"/>
      <text x="80" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#052E16">RAG</text>
      <text x="80" y="70" text-anchor="middle" font-size="11" fill="#052E16">docs + schema</text>
    </g>
    <g transform="translate(420 148)">
      <path d="M0 42L80 0L160 42L80 84L0 42Z" fill="url(#topPurple)"/>
      <path d="M0 42V86L80 128V84L0 42Z" fill="#312E81"/>
      <path d="M160 42V86L80 128V84L160 42Z" fill="#4C1D95"/>
      <text x="80" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#F8FAFC">PLANNER</text>
      <text x="80" y="70" text-anchor="middle" font-size="11" fill="#F5F3FF">workflow graph</text>
    </g>
    <g transform="translate(595 148)">
      <path d="M0 42L80 0L160 42L80 84L0 42Z" fill="url(#topBlue)"/>
      <path d="M0 42V86L80 128V84L0 42Z" fill="#0B3B60"/>
      <path d="M160 42V86L80 128V84L160 42Z" fill="#0E2458"/>
      <text x="80" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#F8FAFC">TOOLS</text>
      <text x="80" y="70" text-anchor="middle" font-size="11" fill="#DBEAFE">SQL + APIs</text>
    </g>
    <g transform="translate(770 148)">
      <path d="M0 42L80 0L160 42L80 84L0 42Z" fill="url(#topAmber)"/>
      <path d="M0 42V86L80 128V84L0 42Z" fill="#78350F"/>
      <path d="M160 42V86L80 128V84L160 42Z" fill="#92400E"/>
      <text x="80" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#451A03">VALIDATE</text>
      <text x="80" y="70" text-anchor="middle" font-size="11" fill="#451A03">confidence gate</text>
    </g>
    <g transform="translate(945 148)">
      <path d="M0 42L80 0L160 42L80 84L0 42Z" fill="url(#topGreen)"/>
      <path d="M0 42V86L80 128V84L0 42Z" fill="#14532D"/>
      <path d="M160 42V86L80 128V84L160 42Z" fill="#166534"/>
      <text x="80" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#052E16">SHIP</text>
      <text x="80" y="70" text-anchor="middle" font-size="11" fill="#052E16">answer + UI</text>
    </g>
  </g>

  <g stroke="#67E8F9" stroke-opacity="0.58" stroke-width="3" filter="url(#glow)">
    <path d="M214 190H242"/>
    <path d="M389 190H417"/>
    <path d="M564 190H592"/>
    <path d="M739 190H767"/>
    <path d="M914 190H942"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="90" y="332" width="920" height="44" rx="15" fill="#020617" stroke="#38BDF8" stroke-opacity="0.25"/>
    <text x="550" y="360" text-anchor="middle" font-size="15" fill="#CBD5E1">Low confidence does not pretend. It asks for clarification, retrieves better context, or falls back to deterministic logic.</text>
  </g>
</svg>
