<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">AI command center</title>
  <desc id="desc">A dark AI command center with panels for agents, RAG, validation, and product user experience.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset=".5" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset=".55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset=".6" stop-color="#34d399"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset=".58" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset=".6" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <style>
      .title { fill:#f8fafc; font:800 42px Inter, Segoe UI, Arial, sans-serif; }
      .sub { fill:#cbd5e1; font:500 16px Inter, Segoe UI, Arial, sans-serif; }
      .label { fill:#f8fafc; font:800 17px Inter, Segoe UI, Arial, sans-serif; }
      .small { fill:#94a3b8; font:600 12px Inter, Segoe UI, Arial, sans-serif; }
      .code { fill:#dbeafe; font:600 13px Consolas, Menlo, monospace; }
      .line { stroke:#67e8f9; stroke-width:2.5; fill:none; opacity:.62; }
    </style>
  </defs>
  <rect width="1200" height="560" rx="30" fill="url(#bg)"/>
  <circle cx="170" cy="78" r="135" fill="#22d3ee" opacity=".08"/>
  <circle cx="1018" cy="460" r="180" fill="#818cf8" opacity=".10"/>
  <path d="M130 460C310 330 432 476 600 318C764 164 902 248 1086 116" class="line"/>
  <path d="M116 410C320 280 422 406 594 270C770 132 920 198 1084 78" class="line" opacity=".35"/>

  <text x="64" y="78" class="title">AI Systems Command Center</text>
  <text x="66" y="110" class="sub">RAG, agents, validation, graphs, and product UX arranged as one inspectable system.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="322" height="240" rx="18" fill="rgba(15,23,42,.88)" stroke="rgba(255,255,255,.14)"/>
    <text x="100" y="214" class="label">Model boundary</text>
    <rect x="100" y="242" width="238" height="44" rx="10" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.12)"/>
    <text x="120" y="270" class="small">Plan before prompting</text>
    <rect x="100" y="304" width="238" height="72" rx="10" fill="#020617" stroke="rgba(103,232,249,.2)"/>
    <text x="120" y="332" class="code">retrieve(context)</text>
    <text x="120" y="356" class="code">validate(output)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="472" y="150" width="260" height="118" rx="18" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.14)"/>
    <rect x="498" y="178" width="58" height="58" rx="13" fill="url(#cyan)"/>
    <path d="M514 207h28M528 192v30" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
    <text x="578" y="199" class="label">Agents</text>
    <text x="578" y="226" class="small">planning, tools, memory</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="472" y="304" width="260" height="118" rx="18" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.14)"/>
    <rect x="498" y="332" width="58" height="58" rx="13" fill="url(#emerald)"/>
    <circle cx="518" cy="358" r="8" fill="#052e16"/>
    <circle cx="542" cy="350" r="8" fill="#052e16"/>
    <circle cx="540" cy="374" r="8" fill="#052e16"/>
    <path d="M526 357l9-4M526 362l8 8" stroke="#052e16" stroke-width="4"/>
    <text x="578" y="353" class="label">Knowledge</text>
    <text x="578" y="380" class="small">RAG and graph context</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="812" y="170" width="318" height="240" rx="18" fill="rgba(15,23,42,.88)" stroke="rgba(255,255,255,.14)"/>
    <text x="842" y="214" class="label">Product surface</text>
    <rect x="842" y="242" width="232" height="32" rx="9" fill="url(#violet)" opacity=".95"/>
    <rect x="842" y="292" width="168" height="22" rx="7" fill="rgba(255,255,255,.12)"/>
    <rect x="842" y="330" width="204" height="22" rx="7" fill="rgba(255,255,255,.12)"/>
    <rect x="842" y="366" width="118" height="22" rx="7" fill="rgba(255,255,255,.12)"/>
    <rect x="1030" y="292" width="44" height="96" rx="12" fill="url(#amber)"/>
  </g>
</svg>
